[project]
name = "gravity-adaptive-hierarchy"
version = "0.1.0"
description = "Gravity-Adaptive Hierarchy for urban region representation learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.2.6",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "torch==2.13.0+cu130",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gah"]

